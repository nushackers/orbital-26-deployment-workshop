name: Deploy workshop slides

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "slides/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: nci
        working-directory: slides
        
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.14
          working-dir: slides
          
      - name: Run Biome
        run: biome ci .
        working-directory: slides

      - name: Build
        run: nr build --base /${{github.event.repository.name}}/
        working-directory: slides

      - name: Verify build output (act)
        if: env.ACT
        run: |
          test -d slides/dist
          test -f slides/dist/index.html
          echo "Build artifact ready (Pages upload skipped under act)"

      - name: Setup Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !env.ACT }}
        with:
          path: slides/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4
